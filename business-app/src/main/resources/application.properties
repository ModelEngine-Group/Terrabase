# Terrabase Business Application 配置文件

# 应用基本信息
spring.application.name=terrabase-business-app
server.port=8080

# JAR包路径配置
# 企业服务实现JAR包的存放路径
enterprise.jar.path=./lib

# 日志配置
logging.level.com.terrabase=INFO
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# 企业服务缓存配置
enterprise.service.cache.enabled=true
enterprise.service.cache.ttl=3600

# KMC (Key Management Center) 配置
terrabase.kmc.enabled=true
terrabase.kmc.default-key-id=default
terrabase.kmc.key-caching=true
terrabase.kmc.max-cache-size=100
terrabase.kmc.key-expiration-time=86400000
terrabase.kmc.enable-key-rotation=false
terrabase.kmc.key-rotation-interval=604800000
terrabase.kmc.enable-audit-log=true

# 监控配置
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# 应用信息
info.app.name=Terrabase Business Application
info.app.description=企业级数据使能平台 - 业务应用模块
info.app.version=1.0.0
info.app.encoding=UTF-8
info.app.java.version=17

# 商业版加解密REST接口配置
terrabase.commercial.oms.base.url=http://localhost:8081/api/
terrabase.commercial.timeout=30000
